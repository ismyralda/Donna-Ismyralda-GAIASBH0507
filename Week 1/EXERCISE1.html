<html>
    <head>
        <title>Exercise 1: HTML Tables</title>
    </head>
    <body>
        <p align="center">Comparison of models</p>
        <table border="1" align="center" cellspacing="0" cellpadding="5" width="500">
            <tr>
                <th>Model</th>
                <th>OS</th>
                <th>Display</th>
                <th>RAM</th>
            </tr>
            <tr>
                <td align="center">Samsung Galaxy S7</td>
                <td rowspan="2" align="center">Android</td>
                <td align="center">5.1"</td>
                <td align="center">4 GB</td>
            </tr>
            <tr>
                <td align="center">Sony Xperia Z5</td>
                <td align="center">4.6"</td>
                <td rowspan="2" align="center">2 GB</td>
            </tr>
            <tr>
                <td align="center">Apple iPhone 6s</td>
                <td align="center">iOS</td>
                <td align="center">4.7"</td>
            </tr>
        </table>
    </body>
</html>
